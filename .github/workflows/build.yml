name: Build PanVK Bifrost Vulkan 1.1 for Android 11

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  repackage-vulkan-driver:
    runs-on: ubuntu-latest
    
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
    - name: 📥 1. Clonar tu propio repositorio (Fork)
      uses: actions/checkout@v4

    - name: 🔧 2. Forzar Empaquetado Monolítico (Inyección de Pasaporte meta.json)
      run: |
        echo "-> Creando espacio de trabajo aislado en el servidor..."
        mkdir -p driver_workspace
        
        echo "-> Verificando la presencia física de tu binario original de 18.22 MB..."
        if [ -f ./libvulkan_freedreno.so ]; then
          cp ./libvulkan_freedreno.so ./driver_workspace/libvulkan_freedreno.so
        else
          echo "-> ERROR CRÍTICO: No se encontró tu archivo libvulkan_freedreno.so en la raíz."
          exit 1
        fi

        cd driver_workspace

        echo "-> Escribiendo el pasaporte de metadatos oficial con precarga de entorno..."
        # El secreto está en inyectar el entorno dinámico "env" dentro del JSON. 
        # Al importarlo, Bannerlator leerá estas llaves y las aplicará de forma limpia en el contenedor.
        cat << 'EOF' > meta.json
        {
          "schemaVersion": 1,
          "type": "vulkan",
          "driver": "panvk",
          "env": {
            "MESA_LOADER_DRIVER_OVERRIDE": "panfrost",
            "PANVK_DEBUG": "sync"
          },
          "name": "Mesa PanVK Driver for Mali (Bifrost)",
          "description": "Custom PanVK Vulkan driver patched with Nihui Android Stubs",
          "author": "Mesa Community / Over-cmd",
          "packageVersion": "26.2",
          "vendor": "Mesa",
          "driverVersion": "1",
          "libraryName": "libvulkan_freedreno.so"
        }
        EOF

        echo "-> Validando permisos de lectura y ejecución nativos de Linux (CHMOD 755)..."
        chmod 755 ./libvulkan_freedreno.so ./meta.json

        echo "=== VERIFICACIÓN CIENTÍFICA: TABLA DE ARCHIVOS SUELTOS ==="
        ls -lh ./
        echo "=========================================================="

        echo "-> Generando el archivo ZIP plano oficial (Strict 2-Files en Raíz)..."
        # La bandera -j purga subcarpetas, metiendo libvulkan_freedreno.so y meta.json sueltos en la raíz
        rm -f ../panvk-mali-bifrost-driver.zip
        zip -j ../panvk-mali-bifrost-driver.zip ./libvulkan_freedreno.so ./meta.json
        cd ..

    - name: 📦 3. Verificar Integridad del ZIP Final Resultante
      run: |
        echo "=== VERIFICACIÓN DEL TAMAÑO TOTAL DEL ZIP ==="
        ls -lh panvk-mali-bifrost-driver.zip
        echo "============================================="

    - name: 📤 4. Subir Driver a los Artefactos de GitHub
      uses: actions/upload-artifact@v4
      with:
        name: panvk-mali-bifrost-driver-zip
        path: panvk-mali-bifrost-driver.zip
