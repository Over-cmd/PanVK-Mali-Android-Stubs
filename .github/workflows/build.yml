name: Build PanVK Bifrost Vulkan 1.1 for Android 11

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  repackage-vulkan-driver:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 1. Clonar tu propio repositorio (Fork)
      uses: actions/checkout@v4

    - name: 🔧 2. Parchear e Inyectar Stubs de Nihui en la Receta de Docker
      run: |
        echo "-> Configurando inyección de parches en caliente para Mesa 26.2..."
        
        # Insertamos comandos dentro de tu Dockerfile.build original para que descargue
        # y aplique los parches nativos de evasión de Linker y desbloqueo de extensiones
        # justo después de clonar el código fuente de Mesa.
        sed -i '/git clone/a RUN curl -L -o android_stub.patch https://githubusercontent.com \&\& patch -p1 < android_stub.patch || true' Dockerfile.build
        sed -i '/git clone/a RUN curl -L -o extensions.patch https://githubusercontent.com \&\& patch -p1 < extensions.patch || true' Dockerfile.build
        
        # Forzamos a Meson a compilar utilizando el archivo de configuración cruzada de Nihui
        sed -i 's|--cross-file .*|--cross-file /root/android-aarch64|g' Dockerfile.build || true
        
        echo "-> Descargando archivo de configuración de entorno android-aarch64..."
        curl -L -o android-aarch64 https://githubusercontent.com

    - name: 🐳 3. Configurar Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🚀 4. Procesar y Generar Compilación Nativa via Docker
      run: |
        # Colocamos el archivo de configuración cruzada en el contexto de Docker
        cp android-aarch64 ./ || true
        docker build --no-cache -f Dockerfile.build --target final -t bannerlator-bifrost-11 .

    - name: 📦 5. Extraer y Forzar Estructura Plana Estricta (4 Archivos en Raíz)
      run: |
        echo "-> Extrayendo el contenedor temporal de Docker..."
        docker create --name container-extract bannerlator-bifrost-11
        docker cp container-extract:/dist/panvk-mali-bifrost-driver.zip ./raw-driver.zip
        docker rm container-extract

        echo "-> Creando espacio de trabajo limpio para la desduplicación..."
        mkdir -p plano_workspace
        unzip ./raw-driver.zip -d ./plano_workspace || true
        cd plano_workspace

        echo "-> Sincronizando meta.json con el pasaporte de enlazado dinámico..."
        # Sobreescribimos el meta.json manteniendo el nombre original de tu biblioteca libvulkan_freedreno.so,
        # pero inyectando el tipo 'vulkan' y la variable LD_PRELOAD para forzar la carga de libglapi.so.0.
        cat << 'EOF' > meta.json
        {
          "schemaVersion": 1,
          "type": "vulkan",
          "driver": "panvk",
          "env": {
            "LD_PRELOAD": "libglapi.so.0"
          },
          "name": "Mesa PanVK Driver for Mali (Bifrost)",
          "description": "Custom PanVK Vulkan driver patched with Nihui Android Stubs",
          "author": "Mesa Community / Over-cmd",
          "packageVersion": "26.2",
          "vendor": "Mesa",
          "driverVersion": "1",
          "libraryName": "libvulkan_freedreno.so"
        }
        EOF

        echo "-> Asegurando permisos nativos de ejecución (CHMOD 755)..."
        # Forzamos los permisos correctos en Linux para que Android no rechace la lectura de los binarios
        chmod 755 libGL.so.1 libglapi.so.0 libvulkan_freedreno.so meta.json || true

        echo "-> Generando el archivo ZIP plano oficial (Estrictamente los 4 archivos sueltos)..."
        # La bandera -j (junk paths) garantiza que el ZIP no tenga carpetas internas, guardando los 4 elementos sueltos
        rm -f ../panvk-mali-bifrost-driver.zip
        zip -j ../panvk-mali-bifrost-driver.zip ./libGL.so.1 ./libglapi.so.0 ./libvulkan_freedreno.so ./meta.json
        cd ..

    - name: 📤 6. Subir Driver a los Artefactos de GitHub
      uses: actions/upload-artifact@v4
      with:
        name: panvk-mali-bifrost-driver-zip
        path: panvk-mali-bifrost-driver.zip
