name: Build PanVK Bifrost Vulkan 1.1 for Android 11

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-vulkan-driver:
    runs-on: ubuntu-latest

    steps:
    - name: 🛠️ Clonar Espejo de Mesa 24.0 Nativo en GitHub Actions
      uses: actions/checkout@v4
      with:
        repository: 'mirror/mesa'
        ref: '24.0'
        path: '.' # Descarga el código directo en la raíz de trabajo

    - name: 📥 Inyectar Stubs Locales del Fork sobre el código de Mesa
      run: |
        # Este paso recrea tus stubs de Android sobre el árbol limpio de Mesa 24.0
        # de forma que Meson los procese localmente sin problemas
        echo "[constants]" > android-32.toml
        echo "ndk_path = '/opt/android-ndk'" >> android-32.toml
        echo "toolchain = ndk_path + '/toolchains/llvm/prebuilt/linux-x86_64/bin'" >> android-32.toml
        echo "api = '30'" >> android-32.toml
        echo "[binaries]" >> android-32.toml
        echo "c       = toolchain + '/armv7a-linux-androideabi' + api + '-clang'" >> android-32.toml
        echo "cpp     = toolchain + '/armv7a-linux-androideabi' + api + '-clang++'" >> android-32.toml
        echo "ar      = toolchain + '/llvm-ar'" >> android-32.toml
        echo "strip   = toolchain + '/llvm-strip'" >> android-32.toml
        echo "[host_machine]" >> android-32.toml
        echo "system = 'android'" >> android-32.toml
        echo "cpu_family = 'arm'" >> android-32.toml
        echo "cpu = 'armv7a'" >> android-32.toml
        echo "endian = 'little'" >> android-32.toml

        echo "[constants]" > android-64.toml
        echo "ndk_path = '/opt/android-ndk'" >> android-64.toml
        echo "toolchain = ndk_path + '/toolchains/llvm/prebuilt/linux-x86_64/bin'" >> android-64.toml
        echo "api = '30'" >> android-64.toml
        echo "[binaries]" >> android-64.toml
        echo "c       = toolchain + '/aarch64-linux-android' + api + '-clang'" >> android-64.toml
        echo "cpp     = toolchain + '/aarch64-linux-android' + api + '-clang++'" >> android-64.toml
        echo "ar      = toolchain + '/llvm-ar'" >> android-64.toml
        echo "strip   = toolchain + '/llvm-strip'" >> android-64.toml
        echo "[host_machine]" >> android-64.toml
        echo "system = 'android'" >> android-64.toml
        echo "cpu_family = 'aarch64'" >> android-64.toml
        echo "cpu = 'arm64'" >> android-64.toml
        echo "endian = 'little'" >> android-64.toml

    - name: Set up Android NDK Nativo Seguro (r25c)
      uses: android-actions/setup-android@v3
      with:
        ndk-version: '25.2.9519653'

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Prune Docker Cache Aggressively
      run: |
        docker builder prune -a -f
        docker system prune -a -f

    - name: Build Driver via Docker injecting NDK
      run: |
        docker build --no-cache \
          --build-arg NDK_PATH_HOST=${{ env.ANDROID_NDK_HOME }} \
          -f Dockerfile.build --target final -t bannerlator-bifrost-11 .

    - name: Extract Zip Package
      run: |
        docker create --name container-extract bannerlator-bifrost-11
        docker cp container-extract:/dist/panvk-mali-bifrost-driver.zip ./panvk-mali-bifrost-driver.zip
        docker rm container-extract

    - name: Upload Zip Package to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: panvk-mali-bifrost-driver-zip
        path: panvk-mali-bifrost-driver.zip
