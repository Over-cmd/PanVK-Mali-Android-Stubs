name: Build PanVK Bifrost Vulkan 1.3 Generic Wrapper (TAR.ZST & ZIP)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  repackage-vulkan-driver:
    runs-on: ubuntu-latest
    
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
    - name: 📥 1. Clonar tu propio repositorio (Fork)
      uses: actions/checkout@v4
      with:
        path: main_repo

    - name: 📥 2. Clonar Fuentes de funnymdzz via Token Interno Seguro (Bypass Total)
      uses: actions/checkout@v4
      with:
        repository: funnymdzz/mesa
        ref: main
        path: mesa

    - name: 🔧 3. Instalar Suite XCB, Cabeceras Clang 18, libclc, LLVMSPIRVLib y Forzar Meson Moderno
      run: |
        sudo apt-get update
        # 🟢 SYNTAX SOLVED: Eliminamos la barra invertida final conflictiva de la linea 31 
        # e inyectamos los paquetes exactos de OpenCL cerrando el comando de forma limpia y legal.
        sudo apt-get install -y ninja-build pkg-config python3-mako python3-ply python3-yaml \
          gettext flex bison glslang-tools llvm-dev libclang-dev clang libclang-common-18-dev \
          rustc cargo python3-pip zip libwayland-dev wayland-protocols \
          libxcb1-dev libx11-xcb-dev libxcb-dri3-dev libxcb-randr0-dev libxcb-xfixes0-dev \
          libxcb-dri2-0-dev libxcb-shm0-dev libxcb-glx0-dev libxcb-keysyms1-dev \
          libxcb-present-dev libxcb-sync-dev libxcb-xinerama0-dev libxshmfence-dev \
          libxrandr-dev libxrender-dev libxext-dev libx11-dev x11proto-dev \
          libclc-18-dev libllvmspirvlib-18-dev

        sudo pip3 install --break-system-packages --upgrade meson
        
        echo "=== VERIFICACIÓN DE VERSIONES EN EL HOST ==="
        meson --version
        ninja --version
        echo "============================================="

    - name: 🔧 4. Compilar mesa_clc de Forma Nativa Externa y Aplicar Parches Planos de Funny
      run: |
        echo "-> Compilando el clon nativo de mesa_clc directo en el Host con Meson Moderno..."
        cd mesa
        # Setup con Panfrost activo en el Host para forzar la inyección de mesa_clc sin errores parásitos
        meson setup build-host -Dgallium-drivers=panfrost -Dvulkan-drivers= -Dglx=disabled -Degl=disabled -Dgbm=disabled -Dbuild-tests=false -Dvideo-codecs=
        
        # Invocamos la forja del ejecutable nativo exacto
        ninja -C build-host src/compiler/clc/mesa_clc
        
        mkdir -p ../main_repo/native_tools
        cp -fv build-host/src/compiler/clc/mesa_clc ../main_repo/native_tools/mesa_clc
        cd ..

        echo "-> Moviendo el código fuente real de funnymdzz al contexto del repositorio..."
        mv ./mesa ./main_repo/mesa
        cd main_repo

        echo "-> Creando extensiones ilimitadas para Vulkan..."
        cat << 'EOF' > ./extensions.patch
        --- a/src/vulkan/util/vk_extensions.py
        +++ b/src/vulkan/util/vk_extensions.py
        @@ -50,6 +50,7 @@ class Extension:
             return ext
         
             def c_android_condition(self):
        +        return 'true'
                 if not self.name.startswith(ANDROID_EXTENSION_WHITELIST_PREFIXES):
                     return 'true'
        EOF

        echo "-> Creando parches para bypass del Linker de Android..."
        cat << 'EOF' > ./android_stub.patch
        --- b/src/android_stub/cutils_stub.cpp
        +++ b/src/android_stub/cutils_stub.cpp
        @@ -5,6 +5,7 @@
         #include "dlfcn_nougat.h"
         extern "C" {
        +int property_get(const char *key, char *value, const char *default_value) { return 0; }
         }
         EOF
        echo "-> Parches de factoría de Funny estructurados de forma limpia."

    - name: 🔧 5. Vincular Android NDK Nativo Completo (Preservar Estructura Interna)
      run: |
        echo "-> Buscando el Android NDK nativo en el servidor de GitHub..."
        NDK_PATH=$(ls -d /usr/local/lib/android/sdk/ndk/* | tail -n 1)
        echo "-> NDK detectado legítimo en: $NDK_PATH"
        cp -r "$NDK_PATH" ./main_repo/android-ndk

    - name: 🐳 6. Configurar Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🚀 7. Procesar Compilación de funnymdzz via Docker Plano (Bypass del Exit Code 1)
      run: |
        cd main_repo
        docker build --no-cache -f Dockerfile.build -t bannerlator-bifrost-11 .

    - name: 📦 8. Instalar Herramientas de Compresión Zstd en el Host
      run: |
        sudo apt-get update && sudo apt-get install -y zstd tar

    - name: 🛠️ 9. Estructurar Árbol de Sistema y Generar Ambos Paquetes (Camuflaje Total v180)
      run: |
        cd main_repo
        echo "-> Creando jerarquía de directorios estándar para el TAR..."
        mkdir -p ./wrapper/usr/lib
        mkdir -p ./wrapper/usr/share/vulkan/icd.d

        echo "-> Extrayendo el archivo binario nativo de la compilación..."
        docker create --name container-extract bannerlator-bifrost-11
        docker cp container-extract:/dist/libvulkan_panfrost.so ./wrapper/usr/lib/libvulkan_freedreno.so
        docker rm container-extract

        echo "-> Creando el archivo manifiesto ICD oficial de Vulkan API 1.3..."
        cat << 'EOF' > ./wrapper/usr/share/vulkan/icd.d/freedreno_icd.aarch64.json
        {
            "file_format_version": "1.0.0",
            "ICD": {
                "library_path": "libvulkan_freedreno.so",
                "api_version": "1.3.289"
            }
        }
        EOF

        chmod 755 ./wrapper/usr/lib/libvulkan_freedreno.so
        chmod 644 ./wrapper/usr/share/vulkan/icd.d/freedreno_icd.aarch64.json

        # GENERACIÓN FORMATO 1: .tar.zst puro manual
        cd wrapper
        tar -I 'zstd -v -19' -cf ../../wrapper.tar.zst usr/
        cd ..

        # GENERACIÓN FORMATO 2: .zip limpio para instaladores gráficos
        mkdir -p ./zip_out/usr/lib
        mkdir -p ./zip_out/usr/share/vulkan/icd.d
        cp -fv ./wrapper/usr/lib/libvulkan_freedreno.so ./zip_out/usr/lib/
        cp -fv ./wrapper/usr/share/vulkan/icd.d/freedreno_icd.aarch64.json ./zip_out/usr/share/vulkan/icd.d/
        
        cd zip_out
        zip -r ../../wrapper.zip usr/
        cd ../..

    - name: 📤 10. Subir Ambos Formatos a los Artefactos de GitHub (TAR.ZST & ZIP)
      uses: actions/upload-artifact@v4
      with:
        name: panvk-bifrost-driver-pack
        path: |
          wrapper.tar.zst
          wrapper.zip
