name: Build PanVK Bifrost Vulkan 1.1 for Android 11

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  repackage-vulkan-driver:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 1. Clonar tu propio repositorio (Fork)
      uses: actions/checkout@v4

    - name: 🔧 2. Parchear Sintaxis, Identidad y Enlazado Dinámico (LD_PRELOAD Injection)
      run: |
        echo "-> Corrigiendo Dockerfile para forzar empaquetado plano..."
        # 1. Aseguramos que el ZIP guarde los archivos libres en la raíz sin carpetas relativas
        sed -i 's/zip -r/zip -j/g' Dockerfile.build || true

        echo "-> Inyectando pasaporte de compatibilidad Mali y precarga de librerías en meta.json..."
        # 2. Modificamos el archivo meta.json. Además de inyectar las credenciales para que Bannerlator
        # lo instale dentro del contenedor, añadimos la variable nativa de Linux LD_PRELOAD.
        # Esto obliga al sistema a precargar libglapi.so.0, resolviendo el fallo de carga del .so de Vulkan.
        if [ -f "meta.json" ]; then
          sed -i 's/"name":/"type": "vulkan", "driver": "panvk", "env": {"LD_PRELOAD": "libglapi.so.0"}, "name":/g' meta.json || true
        fi
        
        echo "=== VERIFICACIÓN DEL PARCHE EN META.JSON ==="
        cat meta.json || true

    - name: 🐳 3. Configurar Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🚀 4. Procesar y Generar Empaquetado de Driver via Docker
      run: |
        docker build --no-cache -f Dockerfile.build --target final -t bannerlator-bifrost-11 .

    - name: 📦 5. Extraer Paquete Zip Final de Android 11
      run: |
        docker create --name container-extract bannerlator-bifrost-11
        docker cp container-extract:/dist/panvk-mali-bifrost-driver.zip ./panvk-mali-bifrost-driver.zip
        docker rm container-extract

    - name: 📤 6. Subir Driver a los Artefactos de GitHub
      uses: actions/upload-artifact@v4
      with:
        name: panvk-mali-bifrost-driver-zip
        path: panvk-mali-bifrost-driver.zip
