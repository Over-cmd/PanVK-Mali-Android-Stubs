name: Build PanVK Bifrost Vulkan 1.1 for Android 11

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  repackage-vulkan-driver:
    runs-on: ubuntu-latest
    
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
    - name: 📥 1. Clonar tu propio repositorio (Fork)
      uses: actions/checkout@v4
      with:
        path: main_repo

    - name: 📥 2. Clonar Fuentes de funnymdzz via Token Interno Seguro (Bypass Total)
      uses: actions/checkout@v4
      with:
        repository: funnymdzz/mesa
        ref: main
        path: mesa

    - name: 🔧 3. Localizar y Estructurar Android NDK para Rutas Cortas (Bypass Bin)
      run: |
        echo "-> Buscando el Android NDK nativo en el servidor de GitHub..."
        NDK_PATH=$(ls -d /usr/local/lib/android/sdk/ndk/* | tail -n 1)
        echo "-> NDK detectado legítimo en: $NDK_PATH"
        
        echo "-> Creando estructura aplanada para que coincida con NDKDIR/bin/..."
        mkdir -p ./main_repo/android-ndk/bin
        
        # Copiamos los binarios lógicos de LLVM/Clang directamente a la raíz bin de forma plana
        cp -r $NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/* ./main_repo/android-ndk/bin/
        
        # Copiamos los sysroots obligatorios para que Clang localice las cabeceras de Android
        cp -r $NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot ./main_repo/android-ndk/sysroot

    - name: 🔧 4. Estructurar Árbol de Trabajo y Mover Fuentes de Mesa
      run: |
        echo "-> Moviendo el código fuente real de funnymdzz al contexto del repositorio..."
        mv ./mesa ./main_repo/mesa
        cd main_repo

        echo "-> Creando extensiones ilimitadas para Vulkan..."
        cat << 'EOF' > ./extensions.patch
        --- a/src/vulkan/util/vk_extensions.py
        +++ b/src/vulkan/util/vk_extensions.py
        @@ -50,6 +50,7 @@ class Extension:
             return ext
         
             def c_android_condition(self):
        +        return 'true'
                 if not self.name.startswith(ANDROID_EXTENSION_WHITELIST_PREFIXES):
                     return 'true'
        EOF

        echo "-> Creando parches para bypass del Linker de Android..."
        cat << 'EOF' > ./android_stub.patch
        --- a/src/android_stub/cutils_stub.cpp
        +++ b/src/android_stub/cutils_stub.cpp
        @@ -5,6 +5,7 @@
         #include "dlfcn_nougat.h"
         extern "C" {
        +int property_get(const char *key, char *value, const char *default_value) { return 0; }
         }
         EOF

    - name: 🐳 5. Configurar Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🚀 6. Procesar Compilación de funnymdzz via Docker (Bypass de Red Completo)
      run: |
        cd main_repo
        docker build --no-cache -f Dockerfile.build -t bannerlator-bifrost-11 .

    - name: 📦 7. Extraer Binario Monolítico de Mali y Renombrar para Engañar al APK
      run: |
        cd main_repo
        echo "-> Extrayendo el archivo nativo de Mali del contenedor..."
        docker create --name container-extract bannerlator-bifrost-11
        docker cp container-extract:/dist/libvulkan_panfrost.so ./libvulkan_panfrost.so
        docker rm container-extract

        echo "-> Ejecutando el truco maestro de renombrado físico..."
        mv ./libvulkan_panfrost.so ./libvulkan_freedreno.so

        echo "-> Escribiendo el pasaporte meta.json real para PanVK Autónomo..."
        cat << 'EOF' > meta.json
        {
          "schemaVersion": 1,
          "type": "vulkan",
          "driver": "panvk",
          "name": "Mesa PanVK Monolithic Driver for Mali (Bifrost)",
          "description": "True PanVK Vulkan autonomous driver compiled from funnymdzz for kbase on API 30",
          "author": "funnymdzz / Over-cmd",
          "packageVersion": "26.2",
          "vendor": "Mesa",
          "driverVersion": "1",
          "libraryName": "libvulkan_freedreno.so"
        }
        EOF

        echo "-> Asegurando permisos nativos de ejecución de Linux (CHMOD 755)..."
        chmod 755 ./libvulkan_freedreno.so ./meta.json

        echo "=== VERIFICACIÓN CIENTÍFICA: INTEGRIDAD DE ARTEFACTOS ==="
        ls -lh ./libvulkan_freedreno.so ./meta.json || true
        echo "========================================================"

        echo "-> Generando el archivo ZIP plano unificado (Strict 2-Files en Raíz)..."
        rm -f ../panvk-mali-bifrost-driver.zip
        zip -j ../panvk-mali-bifrost-driver.zip ./libvulkan_freedreno.so ./meta.json
        cd ..

    - name: 📤 8. Subir Driver a los Artefactos de GitHub
      uses: actions/upload-artifact@v4
      with:
        name: panvk-mali-bifrost-driver-zip
        path: panvk-mali-bifrost-driver.zip
