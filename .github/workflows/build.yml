name: Build PanVK Bifrost Vulkan 1.1 for Android 11

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  repackage-vulkan-driver:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 1. Clonar tu propio repositorio (Fork)
      uses: actions/checkout@v4

    - name: 🐳 2. Configurar Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🚀 3. Procesar y Generar Empaquetado de Driver via Docker
      run: |
        docker build --no-cache -f Dockerfile.build --target final -t bannerlator-bifrost-11 .

    - name: 📦 4. Extraer Paquete y Reparar Permisos Nativos (Bifrost Fix)
      run: |
        echo "-> Extrayendo el contenedor temporal de Docker..."
        docker create --name container-extract bannerlator-bifrost-11
        docker cp container-extract:/dist/panvk-mali-bifrost-driver.zip ./raw-driver.zip
        docker rm container-extract

        echo "-> Desempaquetando para corregir la estructura..."
        mkdir -p driver_workspace
        unzip ./raw-driver.zip -d ./driver_workspace || true
        cd driver_workspace

        echo "-> Sincronizando tu meta.json original con entorno nativo..."
        # Mantenemos intacta la estructura original de tu meta.json, inyectando el tipo
        # y la precarga obligatoria LD_PRELOAD para que el linker no ignore libvulkan_freedreno.so
        cat << 'EOF' > meta.json
        {
          "schemaVersion": 1,
          "type": "vulkan",
          "driver": "panvk",
          "env": {
            "LD_PRELOAD": "libglapi.so.0"
          },
          "name": "Mesa PanVK Driver for Mali",
          "description": "Custom PanVK Vulkan driver for MediaTek/Unisoc",
          "author": "Mesa Community",
          "packageVersion": "26.2",
          "vendor": "Mesa",
          "driverVersion": "1",
          "libraryName": "libvulkan_freedreno.so"
        }
        EOF

        echo "-> Creando el archivo de manifiesto ICD que exige Android..."
        # Generamos el archivo .json que el cargador de Vulkan de Android exige para poder mapear
        # tu binario oficial libvulkan_freedreno.so sin pasarlo por alto.
        cat << 'EOF' > freedreno_icd.json
        {
            "file_format_version": "1.0.0",
            "ICD": {
                "library_path": "libvulkan_freedreno.so",
                "api_version": "1.1.0"
            }
        }
        EOF

        echo "-> Aplicando permisos de ejecución (CHMOD 755) a tus archivos nativos..."
        # Forzamos los permisos correctos para que Android no rechace la lectura de los binarios
        chmod 755 libGL.so.1 libglapi.so.0 libvulkan_freedreno.so meta.json freedreno_icd.json || true

        echo "-> Comprimiendo el paquete final de forma plana..."
        # Re-comprimimos usando zip -j para eliminar cualquier carpeta oculta o relativa
        zip -j ../panvk-mali-bifrost-driver.zip ./libGL.so.1 ./libglapi.so.0 ./libvulkan_freedreno.so ./meta.json ./freedreno_icd.json
        cd ..

    - name: 📤 5. Subir Driver a los Artefactos de GitHub
      uses: actions/upload-artifact@v4
      with:
        name: panvk-mali-bifrost-driver-zip
        path: panvk-mali-bifrost-driver.zip
