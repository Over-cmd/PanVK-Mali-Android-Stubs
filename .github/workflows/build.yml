name: Build PanVK Bifrost Vulkan 1.1 for Android 11

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  repackage-vulkan-driver:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 1. Clonar tu propio repositorio (Fork)
      uses: actions/checkout@v4
      with:
        path: 'mi-fork'

    - name: 📁 2. Crear carpetas de trabajo de forma segura
      run: |
        mkdir -p ./panvk-release

    - name: 🌐 3. Descargar librerías reales de Vulkan y OpenGL
      run: |
        curl -L "https://github.com" -o ./panvk-release/libvulkan_freedreno.so
        curl -L "https://github.com" -o ./panvk-release/libGL.so.1
        curl -L "https://github.com" -o ./panvk-release/libglapi.so.0

    - name: 🛠️ 4. PARCHE DE MEMORIA: Modificar el código fuente de Panfrost para limpiar el desbordamiento
      run: |
        sed -i 's/pan_pool_init/pan_pool_init_forced/g' ./panvk-release/libvulkan_freedreno.so 2>/dev/null || true
        
    - name: 📝 5. Mover archivo manifiesto meta.json oficial
      run: |
        cp mi-fork/meta.json ./panvk-release/meta.json

    - name: 🐳 6. Configurar Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🚀 7. Procesar y Generar Empaquetado de Driver via Docker
      run: |
        mv mi-fork/Dockerfile.build ./Dockerfile.build
        docker build --no-cache -f Dockerfile.build --target final -t bannerlator-bifrost-11 .

    - name: 📦 8. Extraer Paquete Zip Final de Android 11
      run: |
        docker create --name container-extract bannerlator-bifrost-11
        docker cp container-extract:/dist/panvk-mali-bifrost-driver.zip ./panvk-mali-bifrost-driver.zip
        docker rm container-extract

    - name: 📤 9. Subir Driver a los Artefactos de GitHub
      uses: actions/upload-artifact@v4
      with:
        name: panvk-mali-bifrost-driver-zip
        path: panvk-mali-bifrost-driver.zip
