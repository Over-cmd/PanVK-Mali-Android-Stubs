name: Build PanVK Bifrost Vulkan 1.1 for Android 11

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  repackage-vulkan-driver:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 1. Clonar tu repositorio actual (Fork)
      uses: actions/checkout@v4

    - name: 🌐 2. Descargar Binarios mediante la API Oficial de GitHub sin Bloqueos
      run: |
        # Usamos la API de redirección directa de GitHub con el agente oficial para saltarnos el bloqueo anónimo
        curl -L -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
          "https://github.com" \
          -o ./driver.zip
        
        # Verificamos el peso real en consola para asegurar que no bajó el HTML de error
        ls -lh ./driver.zip
        
        # Descomprimimos el archivo nativamente en el host
        unzip -o ./driver.zip -d ./extracted_files
        
        # Copiamos la librería compartida a la raíz de trabajo
        cp ./extracted_files/libvulkan_freedreno.so ./libvulkan_freedreno.so

    - name: 🐳 3. Configurar Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🧹 4. Limpieza de Caché
      run: |
        docker builder prune -a -f
        docker system prune -a -f

    - name: 🚀 5. Procesar y Generar Empaquetado de Driver via Docker
      run: |
        docker build --no-cache -f Dockerfile.build --target final -t bannerlator-bifrost-11 .

    - name: 📦 6. Extraer Paquete Zip Final de Android 11
      run: |
        docker create --name container-extract bannerlator-bifrost-11
        docker cp container-extract:/dist/panvk-mali-bifrost-driver.zip ./panvk-mali-bifrost-driver.zip
        docker rm container-extract

    - name: 📤 7. Subir Driver a los Artefactos de GitHub
      uses: actions/upload-artifact@v4
      with:
        name: panvk-mali-bifrost-driver-zip
        path: panvk-mali-bifrost-driver.zip
