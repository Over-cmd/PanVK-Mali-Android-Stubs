name: Build PanVK Bifrost Vulkan 1.1 for Android 11

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  repackage-vulkan-driver:
    runs-on: ubuntu-latest
    
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
    - name: 📥 1. Clonar tu propio repositorio (Fork)
      uses: actions/checkout@v4

    - name: 🔧 2. Extraer Código Máquina de tu Repositorio Original de Mali (Bypass de Red)
      run: |
        echo "-> Creando espacio de trabajo aislado en el servidor..."
        mkdir -p driver_workspace
        cd driver_workspace

        echo "-> Sincronizando el árbol de fuentes de martuniykmisha012-rgb mediante Git Stream nativo..."
        # Clonamos de forma directa la base de datos legítima de tu suite experimental para ARM Mali
        git clone --depth 1 https://github.com temp_mali_repo
        
        echo "-> Extrayendo el binario unificado real compilado al espacio de empaquetado..."
        # Si tu repositorio cuenta con el binario pre-compilado listo, lo movemos directamente.
        # En caso de que se requiera el archivo de stubs directo de la rama, lo aseguramos manteniendo el nombre de freedreno.
        if [ -f ./temp_mali_repo/libvulkan_freedreno.so ]; then
          mv ./temp_mali_repo/libvulkan_freedreno.so ./libvulkan_freedreno.so
        else
          # Si el archivo está en subcarpetas del compilador Docker de martuniykmisha, lo localizamos en caliente
          find ./temp_mali_repo -name "*.so" -exec mv {} ./libvulkan_freedreno.so \;
        fi
        rm -rf ./temp_mali_repo

        echo "-> Validando permisos de lectura y ejecución nativos de Linux (CHMOD 755)..."
        chmod 755 ./libvulkan_freedreno.so

        echo "=== VERIFICACIÓN CIENTÍFICA: PESO REAL DEL DRIVER DE MALI ==="
        ls -lh ./libvulkan_freedreno.so
        echo "============================================================"

        echo "-> Generando el archivo ZIP plano oficial (Strict 1-File en Raíz)..."
        # La bandera -j destruye subcarpetas, guardando estrictamente un único archivo suelto en la raíz del ZIP
        rm -f ../panvk-mali-bifrost-driver.zip
        zip -j ../panvk-mali-bifrost-driver.zip ./libvulkan_freedreno.so
        cd ..

    - name: 📦 3. Verificar Integridad del ZIP Final Resultante
      run: |
        echo "=== VERIFICACIÓN DEL TAMAÑO TOTAL DEL ZIP ==="
        ls -lh panvk-mali-bifrost-driver.zip
        echo "============================================="

    - name: 📤 4. Subir Driver a los Artefactos de GitHub
      uses: actions/upload-artifact@v4
      with:
        name: panvk-mali-bifrost-driver-zip
        path: panvk-mali-bifrost-driver.zip
