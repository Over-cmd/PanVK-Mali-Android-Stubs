name: Build PanVK Bifrost Stubs for Bannerlator

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-bifrost-driver:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Android NDK Nativo
      uses: android-actions/setup-android@v3
      with:
        ndk-version: '26.1.10909125'

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Prune Docker Cache Aggressively
      run: |
        docker builder prune -a -f
        docker system prune -a -f

    - name: Build Driver via Docker
      run: |
        docker build --no-cache \
          --build-arg NDK_PATH_HOST=${{ env.ANDROID_NDK_HOME }} \
          -f Dockerfile.build --target final -t bannerlator-bifrost-builder .

    - name: Extract Official Zip Package
      run: |
        docker create --name container-extract bannerlator-bifrost-builder
        docker cp container-extract:/dist/panvk-mali-bifrost-driver.zip ./panvk-mali-bifrost-driver.zip
        docker rm container-extract

    - name: Upload Zip Package to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: panvk-mali-bifrost-driver-zip
        path: panvk-mali-bifrost-driver.zip
