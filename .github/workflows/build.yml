name: Build PanVK Bifrost Vulkan 1.1 for Android 11

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  repackage-vulkan-driver:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 1. Clonar tu propio repositorio (Fork)
      uses: actions/checkout@v4
      with:
        path: 'mi-fork'

    - name: 🌐 2. Descargar Librerías Binarias Reales de Vulkan y OpenGL (Raw Mode)
      run: |
        mkdir -p ./panvk-release
        
        # Descargamos los binarios reales de Mesa-PanVK empaquetados para espacio de usuario sin restricciones
        curl -L -s --retry 5 "https://githubusercontent.com" -o ./panvk-release/libvulkan_freedreno.so || true
        curl -L -s --retry 5 "https://githubusercontent.com" -o ./panvk-release/libGL.so.1 || true
        curl -L -s --retry 5 "https://githubusercontent.com" -o ./panvk-release/libglapi.so.0 || true

        # Si el repositorio raw no tenía las librerías auxiliares de OpenGL, usamos un espejo secundario de Termux-Mesa real para Bifrost
        if [ ! -s "./panvk-release/libvulkan_freedreno.so" ] || [ $(wc -c < "./panvk-release/libvulkan_freedreno.so") -lt 100000 ]; then
          echo "Aplicando espejo de emergencia de binarios de Vulkan reales..."
          curl -L "https://github.com" -o ./panvk-release/libvulkan_freedreno.so
        fi
        
        if [ ! -s "./panvk-release/libGL.so.1" ]; then
          curl -L "https://github.com" -o ./panvk-release/libGL.so.1
        fi
        
        if [ ! -s "./panvk-release/libglapi.so.0" ]; then
          curl -L "https://github.com" -o ./panvk-release/libglapi.so.0
        fi

        # Escribimos el manifiesto meta.json EXACTO que me pediste en la raíz
        echo '{
          "schemaVersion": 1,
          "name": "Mesa PanVK Driver for Mali",
          "description": "Custom PanVK Vulkan driver for MediaTek",
          "author": "Mesa Community",
          "packageVersion": "26.2",
          "vendor": "Mesa",\
          "driverVersion": "1",
          "libraryName": "libvulkan_freedreno.so"
        }' > ./panvk-release/meta.json

    - name: 🐳 3. Configurar Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🚀 4. Procesar y Generar Empaquetado de Driver via Docker
      run: |
        mv mi-fork/Dockerfile.build ./Dockerfile.build
        docker build --no-cache -f Dockerfile.build --target final -t bannerlator-bifrost-11 .

    - name: 📦 5. Extraer Paquete Zip Final de Android 11
      run: |
        docker create --name container-extract bannerlator-bifrost-11
        docker cp container-extract:/dist/panvk-mali-bifrost-driver.zip ./panvk-mali-bifrost-driver.zip
        docker rm container-extract

    - name: 📤 6. Subir Driver a los Artefactos de GitHub
      uses: actions/upload-artifact@v4
      with:
        name: panvk-mali-bifrost-driver-zip
        path: panvk-mali-bifrost-driver.zip
