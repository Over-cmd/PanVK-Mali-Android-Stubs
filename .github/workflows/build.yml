name: Build PanVK Bifrost Vulkan 1.1 for Android 11

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-vulkan-driver:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Prune Docker Cache Aggressively
      run: |
        docker builder prune -a -f
        docker system prune -a -f

    - name: Build Driver via Docker
      run: |
        docker build --no-cache -f Dockerfile.build --target final -t bannerlator-bifrost-11 .

    - name: Extract Zip Package
      run: |
        docker create --name container-extract bannerlator-bifrost-11
        docker cp container-extract:/dist/panvk-bifrost-android11.zip ./panvk-bifrost-android11.zip
        docker rm container-extract

    - name: Upload Zip Package to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: panvk-bifrost-vulkan11-driver
        path: panvk-bifrost-android11.zip
