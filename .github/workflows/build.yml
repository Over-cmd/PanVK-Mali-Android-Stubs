name: Build PanVK Bifrost Vulkan 1.1 for Android 11

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  repackage-vulkan-driver:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 1. Clonar tu repositorio
      uses: actions/checkout@v4

    - name: 🔧 2. Crear Inyecciones de Parches Estáticos
      run: |
        # Creación de parches y configuraciones sin dependencias de red
        cat << 'EOF' > extensions.patch
        --- mesa-orig/src/vulkan/util/vk_extensions.py
        +++ mesa-new/src/vulkan/util/vk_extensions.py
        @@ -50,6 +50,7 @@ class Extension:
        +        return 'true'
        EOF

        cat << 'EOF' > android-aarch64
        [binaries]
        c = ['ccache', 'NDKDIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang']
        cpp = ['ccache', 'NDKDIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++', '-fno-exceptions', '-static-libstdc++']
        [host_machine]
        system = 'android'
        cpu_family = 'aarch64'
        EOF

        # Inyección de parches en el Dockerfile
        sed -i '/git clone/a RUN cd mesa && patch -p1 < /root/extensions.patch || true' Dockerfile.build
        sed -i 's|--cross-file .*|--cross-file /root/android-aarch64|g' Dockerfile.build || true

    - name: 🐳 3. Configurar Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🚀 4. Compilación Nativa via Docker
      run: |
        cp extensions.patch ./ || true
        cp android-aarch64 ./ || true
        docker build --no-cache -f Dockerfile.build --target final -t bannerlator-bifrost-11 .

    - name: 📦 5. Extracción y Empaquetado Final
      run: |
        docker create --name container-extract bannerlator-bifrost-11
        docker cp container-extract:/dist/panvk-mali-bifrost-driver.zip ./raw-driver.zip
        docker rm container-extract
        # (Aquí se añaden pasos para generar meta.json y re-zipar, simplificado)
        mkdir -p plano_workspace && unzip ./raw-driver.zip -d ./plano_workspace
        # Generar meta.json y re-zipar los 4 archivos necesarios
        # ... (comandos de manipulación de archivos)

    - name: 📤 6. Subir Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: panvk-mali-bifrost-driver-zip
        path: panvk-mali-bifrost-driver.zip
