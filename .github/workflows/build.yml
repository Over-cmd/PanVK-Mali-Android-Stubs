name: Build PanVK Bifrost Vulkan 1.1 for Android 11

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  repackage-vulkan-driver:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 1. Clonar tu propio repositorio (Fork)
      uses: actions/checkout@v4
      with:
        path: 'mi-fork'

    - name: 🌐 2. Descargar Librerías Binarias Reales de Vulkan Bifrost
      run: |
        mkdir -p ./panvk-release
        
        # Descarga de binarios reales de Mesa con soporte Bifrost maduro (no vacíos)
        curl -L -s --retry 5 "https://r2.dev" -o ./panvk-release/libvulkan_freedreno.so || true
        curl -L -s --retry 5 "https://r2.dev" -o ./panvk-release/libGL.so.1 || true
        curl -L -s --retry 5 "https://r2.dev" -o ./panvk-release/libglapi.so.0 || true

        # Forzar respaldo con firmas de compatibilidad si el servidor principal demora
        if [ ! -s "./panvk-release/libvulkan_freedreno.so" ]; then
          curl -L "https://github.com" -o ./panvk-release/libvulkan_freedreno.so
          curl -L "https://github.com" -o ./panvk-release/libGL.so.1
          curl -L "https://github.com" -o ./panvk-release/libglapi.so.0
        fi

        # Escribimos el manifiesto meta.json con el bypass de Qualcomm requerido por Adrenotools
        echo '{
          "schemaVersion": 1,
          "name": "Mesa PanVK Driver for Mali (Bifrost)",
          "description": "Custom PanVK Vulkan 1.1 driver forced for MediaTek Bifrost running on Android 11.",
          "author": "Mesa Community",
          "packageVersion": "24.0",
          "vendor": "Qualcomm",
          "driverVersion": "1",
          "libraryName": "libvulkan_freedreno.so"
        }' > ./panvk-release/meta.json

    - name: 🐳 3. Configurar Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🚀 4. Procesar y Generar Empaquetado de Driver via Docker
      run: |
        mv mi-fork/Dockerfile.build ./Dockerfile.build
        docker build --no-cache -f Dockerfile.build --target final -t bannerlator-bifrost-11 .

    - name: 📦 5. Extraer Paquete Zip Final de Android 11
      run: |
        docker create --name container-extract bannerlator-bifrost-11
        docker cp container-extract:/dist/panvk-mali-bifrost-driver.zip ./panvk-mali-bifrost-driver.zip
        docker rm container-extract

    - name: 📤 6. Subir Driver a los Artefactos de GitHub
      uses: actions/upload-artifact@v4
      with:
        name: panvk-mali-bifrost-driver-zip
        path: panvk-mali-bifrost-driver.zip
