name: Build PanVK Bifrost Vulkan 1.1 for Android 11

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  repackage-vulkan-driver:
    runs-on: ubuntu-latest
    
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
    - name: 📥 1. Clonar tu propio repositorio (Fork)
      uses: actions/checkout@v4

    - name: 🔧 2. Instalar Subversion Genuino y Exportar Binario Real de 18.25 MB
      run: |
        echo "-> Actualizando los repositorios del sistema..."
        sudo apt-get update

        echo "-> Instalando Subversion usando el candidato oficial de Ubuntu..."
        # Corregido: Usamos 'subversion' en lugar de 'svn' para evitar el error 100
        sudo apt-get install -y subversion

        echo "-> Creando espacio de trabajo aislado en el servidor..."
        mkdir -p driver_workspace
        cd driver_workspace

        echo "-> Descargando el archivo binario auténtico compilado de Mesa..."
        # Usamos la exportación física directa sobre el tronco de archivos del repositorio.
        # Esto extrae el binario de vídeo en bruto de 18 MB saltándose las redirecciones HTML web de 561 KB.
        svn export https://github.com ./libvulkan_freedreno.so --force

        echo "-> Validando permisos de lectura y ejecución nativos de Linux (CHMOD 755)..."
        chmod 755 ./libvulkan_freedreno.so

        echo "=== VERIFICACIÓN CIENTÍFICA: TABLA DE PESOS REALES ==="
        ls -lh ./libvulkan_freedreno.so
        echo "======================================================"

        echo "-> Generando el archivo ZIP plano oficial (Strict 1-File en Raíz)..."
        # La bandera -j introduce libvulkan_freedreno.so suelto en la raíz del ZIP final sin carpetas intermedias
        zip -j ../panvk-mali-bifrost-driver.zip ./libvulkan_freedreno.so
        cd ..

    - name: 📦 3. Verificar Integridad del ZIP Final Resultante
      run: |
        echo "=== VERIFICACIÓN DEL TAMAÑO TOTAL DEL ZIP ==="
        ls -lh panvk-mali-bifrost-driver.zip
        echo "============================================="

    - name: 📤 4. Subir Driver a los Artefactos de GitHub
      uses: actions/upload-artifact@v4
      with:
        name: panvk-mali-bifrost-driver-zip
        path: panvk-mali-bifrost-driver.zip
