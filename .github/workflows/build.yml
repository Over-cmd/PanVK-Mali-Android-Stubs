name: Build PanVK Bifrost Vulkan 1.1 for Android 11

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  repackage-vulkan-driver:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 1. Clonar tu propio repositorio (Fork)
      uses: actions/checkout@v4

    - name: 🔧 2. Generar Mutación de Parches Nihui para Backend Bifrost
      run: |
        echo "-> Creando el archivo unificado de extensiones ilimitadas para Vulkan..."
        cat << 'EOF' > extensions.patch
        --- a/src/vulkan/util/vk_extensions.py
        +++ b/src/vulkan/util/vk_extensions.py
        @@ -50,6 +50,7 @@ class Extension:
             return ext
         
             def c_android_condition(self):
        +        return 'true'
                 if not self.name.startswith(ANDROID_EXTENSION_WHITELIST_PREFIXES):
                     return 'true'
        EOF

        echo "-> Creando mapa de configuración cruzada de Meson para API 26..."
        cat << 'EOF' > android-aarch64
        [binaries]
        c = ['ccache', '/root/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang']
        cpp = ['ccache', '/root/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++', '-fno-exceptions', '-static-libstdc++']
        ar = '/root/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
        strip = '/root/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
        [host_machine]
        system = 'android'
        cpu_family = 'aarch64'
        cpu = 'armv8-a'
        endian = 'little'
        EOF

        echo "-> Reconfigurando directivas de compilación estática profunda en el Dockerfile..."
        # 1. Forzamos la descarga del parche original de bypass de Nougat de Nihui
        sed -i '/git clone/a RUN curl -L -f -o android_stub.patch https://githubusercontent.com \&\& patch -p1 < android_stub.patch || true' Dockerfile.build
        
        # 2. Inyectamos la mutación en caliente de Python para desbloquear extensiones
        sed -i '/git clone/a RUN cd mesa \&\& patch -p1 < /root/extensions.patch || true' Dockerfile.build
        
        # 3. EL PARCHE CRÍTICO BIFROST: Forzamos la inyección del enlace estático total de la API.
        # Desactivamos shared-glapi para que el compilador no cree librerías sueltas e integramos
        # panfrost en los drivers activos de gallium y vulkan. Esto obliga al Linker de C++ a fusionar 
        # el puente de bypass fake_dlopen directamente con el núcleo de tu GPU Mali-G52, dándole su tamaño real.
        sed -i 's|--cross-file .*|--cross-file /root/android-aarch64 -Dshared-glapi=false -Dgallium-drivers=[panfrost] -Dvulkan-drivers=[panfrost] \|g' Dockerfile.build || true

    - name: 🐳 3. Configurar Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🚀 4. Procesar Compilación Monolítica Nativa via Docker
      run: |
        cp extensions.patch ./ || true
        cp android-aarch64 ./ || true
        docker build --no-cache -f Dockerfile.build --target final -t bannerlator-bifrost-11 .

    - name: 📦 5. Extraer y Estructurar Paquete de 4 Archivos Planos Reales
      run: |
        echo "-> Extrayendo el contenedor final de Docker..."
        docker create --name container-extract bannerlator-bifrost-11
        docker cp container-extract:/dist/panvk-mali-bifrost-driver.zip ./raw-driver.zip
        docker rm container-extract

        echo "-> Creando espacio de trabajo para desduplicación de librerías..."
        mkdir -p unificado_workspace
        unzip ./raw-driver.zip -d ./unificado_workspace || true
        cd unificado_workspace

        echo "-> Escribiendo meta.json oficial con inicialización de hilos gráficos..."
        # Dejamos el archivo meta.json suelto en la raíz inyectando la precarga de la API
        cat << 'EOF' > meta.json
        {
          "schemaVersion": 1,
          "type": "vulkan",
          "driver": "panvk",
          "env": {
            "LD_PRELOAD": "libglapi.so.0"
          },
          "name": "Mesa PanVK Driver for Mali (Bifrost)",
          "description": "Custom PanVK Vulkan driver patched with Nihui Android Stubs",
          "author": "Mesa Community / Over-cmd",
          "packageVersion": "26.2",
          "vendor": "Mesa",
          "driverVersion": "1",
          "libraryName": "libvulkan_freedreno.so"
        }
        EOF

        echo "-> Asegurando compatibilidad de permisos nativos de Linux (CHMOD 755)..."
        chmod 755 libGL.so.1 libglapi.so.0 libvulkan_freedreno.so meta.json || true

        echo "=== VERIFICACIÓN DE INTEGRIDAD LOGÍSTICA DE TAMAÑO ==="
        ls -lh ./
        echo "======================================================="

        echo "-> Generando el archivo ZIP plano oficial de Bannerlator..."
        # La bandera -j purga subcarpetas intermedias y une los 4 archivos grandes plano en la raíz del ZIP
        rm -f ../panvk-mali-bifrost-driver.zip
        zip -j ../panvk-mali-bifrost-driver.zip ./libGL.so.1 ./libglapi.so.0 ./libvulkan_freedreno.so ./meta.json
        cd ..

    - name: 📤 6. Subir Driver a los Artefactos de GitHub
      uses: actions/upload-artifact@v4
      with:
        name: panvk-mali-bifrost-driver-zip
        path: panvk-mali-bifrost-driver.zip
