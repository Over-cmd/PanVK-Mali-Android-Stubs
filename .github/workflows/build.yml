name: Build PanVK Bifrost Vulkan 1.1 for Android 11

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  repackage-vulkan-driver:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 1. Clonar tu propio repositorio (Fork)
      uses: actions/checkout@v4

    - name: 🔧 2. Parchear Sintaxis, Entorno y Manifiesto ICD Nativo (Mesa Freedreno Fix)
      run: |
        echo "-> Sincronizando meta.json original e inyectando entorno nativo..."
        # Configuramos el meta.json manteniendo el nombre original de tu biblioteca,
        # pero añadiendo la estructura que Bannerlator exige para activarlo y la precarga de hilos.
        cat << 'EOF' > meta.json
        {
          "schemaVersion": 1,
          "type": "vulkan",
          "driver": "panvk",
          "env": {
            "LD_PRELOAD": "libglapi.so.0"
          },
          "name": "Mesa PanVK Driver for Mali",
          "description": "Custom PanVK Vulkan driver for MediaTek/Unisoc",
          "author": "Mesa Community",
          "packageVersion": "26.2",
          "vendor": "Mesa",
          "driverVersion": "1",
          "libraryName": "libvulkan_freedreno.so"
        }
        EOF

        echo "-> Creando el archivo obligatorio de manifiesto ICD para Freedreno Vulkan..."
        # Generamos el manifiesto que exige el cargador de Vulkan de Android para poder
        # leer e inicializar el archivo libvulkan_freedreno.so de forma directa.
        cat << 'EOF' > freedreno_icd.json
        {
            "file_format_version": "1.0.0",
            "ICD": {
                "library_path": "libvulkan_freedreno.so",
                "api_version": "1.1.0"
            }
        }
        EOF

        echo "-> Modificando Dockerfile para empaquetado plano unificado (zip -j)..."
        # Reemplazamos la línea de compresión original del Dockerfile para forzar zip -j (junk paths).
        # Esto elimina los puntos y rutas relativas, dejando tus 3 archivos originales con sus pesos
        # independientes planos en la raíz del ZIP junto a los metadatos necesarios.
        sed -i 's|RUN zip -r ../panvk-mali-bifrost-driver.zip .*|RUN zip -j ../panvk-mali-bifrost-driver.zip ./libGL.so.1 ./libglapi.so.0 ./libvulkan_freedreno.so ./meta.json ./freedreno_icd.json|g' Dockerfile.build || true

        echo "=== VERIFICACIÓN DE MANIFIESTOS NATIVOS ==="
        cat meta.json || true
        echo "========================================"
        cat freedreno_icd.json || true

    - name: 🐳 3. Configurar Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🚀 4. Procesar y Generar Empaquetado de Driver via Docker
      run: |
        docker build --no-cache -f Dockerfile.build --target final -t bannerlator-bifrost-11 .

    - name: 📦 5. Extraer Paquete Zip Final de Android 11
      run: |
        docker create --name container-extract bannerlator-bifrost-11
        docker cp container-extract:/dist/panvk-mali-bifrost-driver.zip ./panvk-mali-bifrost-driver.zip
        docker rm container-extract

    - name: 📤 6. Subir Driver a los Artefactos de GitHub
      uses: actions/upload-artifact@v4
      with:
        name: panvk-mali-bifrost-driver-zip
        path: panvk-mali-bifrost-driver.zip
