name: Build PanVK Bifrost Vulkan 1.3 Generic Wrapper (TAR.ZST)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  repackage-vulkan-driver:
    runs-on: ubuntu-latest
    
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
    - name: 📥 1. Clonar tu propio repositorio (Fork)
      uses: actions/checkout@v4
      with:
        path: main_repo

    - name: 📥 2. Clonar Fuentes de funnymdzz via Token Interno Seguro (Bypass Total)
      uses: actions/checkout@v4
      with:
        repository: funnymdzz/mesa
        ref: main
        path: mesa

    - name: 🔧 3. Instalar Herramientas, Cabeceras Clang 18 y Forzar Meson Moderno
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build pkg-config python3-mako python3-ply python3-yaml \
          gettext flex bison glslang-tools llvm-dev libclang-dev clang libclang-common-18-dev rustc cargo python3-pip
        
        sudo pip3 install --break-system-packages --upgrade meson
        
        echo "=== VERIFICACIÓN DE VERSIONES EN EL HOST ==="
        meson --version
        ninja --version
        echo "============================================="

    - name: 🔧 4. Compilar mesa_clc de Forma Nativa Externa y Parchear Fuentes de Funny
      run: |
        echo "-> Compilando el clon nativo de mesa_clc directo en el Host con Meson Moderno..."
        cd mesa
        # 🟢 CORRECCIÓN SUPREMA DE FACTORÍA FUNNY: Limpiamos por completo las flags obsoletas. 
        # Dejamos que Meson configure de forma automatica el compilador nativo clc apagando unicamente 
        # las pruebas y los codecs de video para evitar el choque de opciones invalidas.
        meson setup build-host -Dgallium-drivers= -Dvulkan-drivers= -Dglx=disabled -Degl=disabled -Dgbm=disabled -Dbuild-tests=false -Dvideo-codecs=
        ninja -C build-host src/compiler/clc/mesa_clc
        
        # Guardamos el ejecutable nativo en un lugar seguro del repositorio principal
        mkdir -p ../main_repo/native_tools
        cp -fv build-host/src/compiler/clc/mesa_clc ../main_repo/native_tools/mesa_clc
        cd ..

        echo "-> Moviendo el código fuente real de funnymdzz al contexto del repositorio..."
        mv ./mesa ./main_repo/mesa
        cd main_repo

        echo "-> Creando extensiones ilimitadas para Vulkan..."
        cat << 'EOF' > ./extensions.patch
        --- a/src/vulkan/util/vk_extensions.py
        +++ b/src/vulkan/util/vk_extensions.py
        @@ -50,6 +50,7 @@ class Extension:
             return ext
         
             def c_android_condition(self):
        +        return 'true'
                 if not self.name.startswith(ANDROID_EXTENSION_WHITELIST_PREFIXES):
                     return 'true'
        EOF

        echo "-> Creando parches para bypass del Linker de Android..."
        cat << 'EOF' > ./android_stub.patch
        --- b/src/android_stub/cutils_stub.cpp
        +++ b/src/android_stub/cutils_stub.cpp
        @@ -5,6 +5,7 @@
         #include "dlfcn_nougat.h"
         extern "C" {
        +int property_get(const char *key, char *value, const char *default_value) { return 0; }
         }
         EOF

        # INYECCIÓN SUPREMA DE ADRENOTOOLS Y PARALELISMO OCTA-CORE
        TARGET_DEVICE_C="mesa/src/vulkan/wrapper/wrapper_device.c"
        if [ -f "$TARGET_DEVICE_C" ]; then
            echo "-> Soldando Adrenotools y control Octa-Core en el ADN del driver..."
            sed -i '/#include "wrapper_private.h"/a \
            #include <adrenotools/driver.h>\n\
            #ifndef BOX64_DYNAREC_BIGBLOCK\n#define BOX64_DYNAREC_BIGBLOCK 0\n#endif\n\
            #ifndef BOX64_MOUSE_ASYNC\n#define BOX64_MOUSE_ASYNC 1\n#endif\n\
            #ifndef BOX64_DYNAREC_STRONGMEM\n#define BOX64_DYNAREC_STRONGMEM 1\n#endif\n\
            #ifndef MALLOC_TRIM_THRESHOLD_\n#define MALLOC_TRIM_THRESHOLD_ 65536\n#endif' "$TARGET_DEVICE_C"
            
            sed -i '/wrapper_CreateDevice/!b;/{/a \  adrenotools_open_libvulkan_hooks(physical_device->instance->adrenotools_gpu_workaround);' "$TARGET_DEVICE_C"
            echo "-> Adrenotools inyectado con éxito."
        fi

    - name: 🔧 5. Vincular Android NDK Nativo Completo (Preservar Estructura Interna)
      run: |
        echo "-> Buscando el Android NDK nativo en el servidor de GitHub..."
        NDK_PATH=$(ls -d /usr/local/lib/android/sdk/ndk/* | tail -n 1)
        echo "-> NDK detectado legítimo en: $NDK_PATH"
        cp -r "$NDK_PATH" ./main_repo/android-ndk

    - name: 🐳 6. Configurar Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🚀 7. Procesar Compilación de funnymdzz via Docker Plano (Bypass del Exit Code 1)
      run: |
        cd main_repo
        docker build --no-cache -f Dockerfile.build -t bannerlator-bifrost-11 .

    - name: 📦 8. Instalar Herramientas de Compresión Zstd en el Host
      run: |
        sudo apt-get update && sudo apt-get install -y zstd tar

    - name: 🛠️ 9. Estructurar Árbol de Sistema y Generar Wrapper .tar.zst (Modelo Camuflaje APK)
      run: |
        cd main_repo
        mkdir -p ./wrapper/usr/lib
        mkdir -p ./wrapper/usr/share/vulkan/icd.d

        echo "-> Extrayendo el archivo binario nativo de la compilación..."
        docker create --name container-extract bannerlator-bifrost-11
        docker cp container-extract:/dist/libvulkan_panfrost.so ./wrapper/usr/lib/libvulkan_freedreno.so
        docker rm container-extract

        echo "-> Creando el archivo manifiesto ICD oficial de Vulkan (Espejo Estructural Actualizado API 1.3)..."
        cat << 'EOF' > ./wrapper/usr/share/vulkan/icd.d/freedreno_icd.aarch64.json
        {
            "file_format_version": "1.0.0",
            "ICD": {
                "library_path": "libvulkan_freedreno.so",
                "api_version": "1.3.289"
            }
        }
        EOF

        chmod 755 ./wrapper/usr/lib/libvulkan_freedreno.so
        chmod 644 ./wrapper/usr/share/vulkan/icd.d/freedreno_icd.aarch64.json

        echo "=== VERIFICACIÓN DE INTEGRIDAD ESTRUCTURAL EN LA RAÍZ ==="
        find ./wrapper -print
        echo "========================================================"

        echo "-> Comprimiendo el árbol usr/ en un Wrapper .tar.zst puro (Nivel 19)..."
        cd wrapper
        tar -I 'zstd -v -19' -cf ../../wrapper.tar.zst usr/
        cd ../..

    - name: 📤 10. Subir Wrapper (.tar.zst) a los Artefactos de GitHub
      uses: actions/upload-artifact@v4
      with:
        name: panvk-generic-wrapper-zst
        path: wrapper.tar.zst
