name: Build PanVK Bifrost Vulkan 1.3 Generic Wrapper (TAR.ZST & ZIP)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android-wrapper:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        build-type: [release]

    steps:
    - name: 📥 1. Clonar tu propio repositorio (Fork)
      uses: actions/checkout@v4
      with:
        path: main_repo

    - name: 📥 2. Clonar Fuentes de funnymdzz via Token Interno Seguro (Bypass Total)
      uses: actions/checkout@v4
      with:
        repository: funnymdzz/mesa
        ref: main
        path: mesa

    - name: 🧬 3. Aplicar Parche anon_file.c de Funny para memfd_create
      run: |
        cd mesa
        sed -i 's/#if defined(HAVE_MEMFD_CREATE) \&\& !defined __TERMUX__/#if defined(HAVE_MEMFD_CREATE)/' src/util/anon_file.c
        cd ..

    - name: 🔧 4. Instalar Suite XCB, Cabeceras Clang, libdrm y LLVM-20 Nativos del Sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build pkg-config python3-mako python3-ply python3-yaml \
          gettext flex bison glslang-tools rustc cargo python3-pip zip libwayland-dev wayland-protocols \
          libxcb1-dev libx11-xcb-dev libxcb-dri3-dev libxcb-randr0-dev libxcb-xfixes0-dev \
          libxcb-dri2-0-dev libxcb-shm0-dev libxcb-glx0-dev libxcb-keysyms1-dev \
          libxcb-present-dev libxcb-sync-dev libxcb-xinerama0-dev libxshmfence-dev \
          libxrandr-dev libxrender-dev libxext-dev libx11-dev x11proto-dev libdrm-dev
        
        sudo apt-get install -y llvm-20-dev libclang-20-dev libclc-20-dev libllvmspirvlib-20-dev spirv-tools libelf-dev
        sudo pip3 install --break-system-packages --ignore-installed mako PyYAML meson ninja packaging

        echo "=== VERIFICACIÓN DE VERSIONES EN EL HOST ==="
        meson --version
        ninja --version
        echo "============================================="

    - name: 🔧 5. Generar las Tres Herramientas Nativas en el Host y Enlazar Shims de Funny
      run: |
        cd mesa
        meson setup build-host -Dplatforms=[] -Dgallium-drivers=[] -Dvulkan-drivers=[] -Dtools=panfrost -Dprecomp-compiler=enabled -Dinstall-precomp-compiler=true -Dllvm=enabled -Dmesa-clc=enabled -Dinstall-mesa-clc=true
        ninja -C build-host src/compiler/clc/mesa_clc src/compiler/spirv/vtn_bindgen2 src/panfrost/clc/panfrost_compile
        
        ln -sf "src/compiler/clc/mesa_clc" "build-host/src/compiler/clc/mesa-clc"
        ln -sf "src/compiler/spirv/vtn_bindgen2" "build-host/src/compiler/spirv/vtn-bindgen2"
        
        echo "$GITHUB_WORKSPACE/mesa/build-host/src/compiler/clc" >> $GITHUB_PATH
        echo "$GITHUB_WORKSPACE/mesa/build-host/src/compiler/spirv" >> $GITHUB_PATH
        echo "$GITHUB_WORKSPACE/mesa/build-host/src/panfrost/clc" >> $GITHUB_PATH
        cd ..

    - name: 🧬 6. Inyectar Parches de Extensiones Ilimitadas de tu Ecosistema
      run: |
        cd main_repo
        cat << 'EOF' > ./extensions.patch
        --- a/src/vulkan/util/vk_extensions.py
        +++ b/src/vulkan/util/vk_extensions.py
        @@ -50,6 +50,7 @@ class Extension:
             return ext
         
             def c_android_condition(self):
        +        return 'true'
                 if not self.name.startswith(ANDROID_EXTENSION_WHITELIST_PREFIXES):
                     return 'true'
        EOF
        cd ..
        cd mesa && git apply ../main_repo/extensions.patch || true
        cd ..

    - name: 🔧 7. Calibrar Cross-File Dinámico y Configurar Meson Cruzado para Android
      run: |
        REAL_NDK="$ANDROID_NDK_LATEST_HOME"
        echo "-> NDK del Host detectado en: $REAL_NDK"
        sed -i "s|/root/android-ndk|$REAL_NDK|g" main_repo/android-aarch64

        cd mesa
        export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
        export MESON_WORKING_DIR="$GITHUB_WORKSPACE"
        export PKG_CONFIG_FOR_BUILD="pkg-config"
        export PKG_CONFIG_PATH="$REAL_NDK/prebuilt/linux-x86_64/lib/pkgconfig"

        # 🟢 CONFI SANADA: Borramos la flag experimental -Dintel-clc=disabled que trababa el script
        meson setup build --reconfigure \
            --cross-file ../main_repo/android-aarch64 \
            -Dbuildtype=${{ matrix.build-type }} \
            -Dplatforms=android,x11 \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Dplatform-sdk-version=30 \
            -Dglx=disabled \
            -Dgbm=disabled \
            -Degl=disabled \
            -Dopengl=false \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dglvnd=disabled \
            -Dvalgrind=disabled \
            -Dgallium-drivers= \
            -Dshared-glapi=disabled \
            -Dzstd=disabled \
            -Dmesa-clc=system \
            -Dprecomp-compiler=system \
            -Dvulkan-drivers=panfrost \
            -Dllvm=disabled \
            -Dpanfrost-kmds=kbase,panthor
            
    - name: 🚀 8. Compilar Proyecto en el Mismo Suelo via Ninja Nativo
      run: |
        cd mesa
        meson compile -C build

    - name: 📦 9. Extraer Silicio Puro y Aplicar Camuflaje Freedreno en la Carpeta usr/
      run: |
        mkdir -p ./wrapper/usr/lib
        mkdir -p ./wrapper/usr/share/vulkan/icd.d

        cp -fv ./mesa/build/src/panfrost/vulkan/libvulkan_panfrost.so ./wrapper/usr/lib/libvulkan_freedreno.so

        echo "-> Creamos el manifiesto ICD oficial de Vulkan API 1.3 con camuflaje..."
        cat << 'EOF' > ./wrapper/usr/share/vulkan/icd.d/freedreno_icd.aarch64.json
        {
            "file_format_version": "1.0.0",
            "ICD": {
                "library_path": "libvulkan_freedreno.so",
                "api_version": "1.3.289"
            }
        }
        EOF

        chmod 755 ./wrapper/usr/lib/libvulkan_freedreno.so
        chmod 644 ./wrapper/usr/share/vulkan/icd.d/freedreno_icd.aarch64.json

    - name: 🛠️ 10. Forjar Empaquetado Doble Extremo (.TAR.ZST & .ZIP)
      run: |
        cd wrapper
        tar -I 'zstd -v -19' -cf ../wrapper.tar.zst usr/
        cd ..

        mkdir -p ./zip_out/usr/lib
        mkdir -p ./zip_out/usr/share/vulkan/icd.d
        cp -fv ./wrapper/usr/lib/libvulkan_freedreno.so ./zip_out/usr/lib/
        cp -fv ./wrapper/usr/share/vulkan/icd.d/freedreno_icd.aarch64.json ./zip_out/usr/share/vulkan/icd.d/
        cd zip_out
        zip -r ../wrapper.zip usr/
        cd ..

    - name: 📤 11. Subir Ambos Formatos a los Artefactos de GitHub (TAR.ZST & ZIP)
      uses: actions/upload-artifact@v4
      with:
        name: panvk-bifrost-driver-pack
        path: |
          wrapper.tar.zst
          wrapper.zip
