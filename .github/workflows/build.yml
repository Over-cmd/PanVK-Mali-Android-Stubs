name: Build PanVK Bifrost Vulkan 1.1 for Android 11

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  repackage-vulkan-driver:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 1. Clonar tu propio repositorio (Fork)
      uses: actions/checkout@v4

    - name: 🔧 2. Parchear Sintaxis, Identidad e ICD Vulkan Manifest (Full Load Fix)
      run: |
        echo "-> Configurando meta.json con pasaporte Mali..."
        # 1. Ajustamos meta.json para que Bannerlator lo instale dentro del contenedor
        if [ -f "meta.json" ]; then
          sed -i 's/"name":/"type": "vulkan", "driver": "panvk", "env": {"LD_PRELOAD": "libglapi.so.0"}, "name":/g' meta.json || true
        fi

        echo "-> Creando el archivo obligatorio de manifiesto ICD para Vulkan..."
        # 2. Generamos el archivo .json que el cargador de Vulkan de Android exige para poder
        # mapear e inicializar el binario libvulkan_freedreno.so. Sin esto, el driver no se lee.
        cat << 'EOF' > freedreno_icd.json
        {
            "file_format_version": "1.0.0",
            "ICD": {
                "library_path": "libvulkan_freedreno.so",
                "api_version": "1.1.0"
            }
        }
        EOF

        echo "-> Modificando Dockerfile para empaquetar de forma plana con el JSON..."
        # 3. Forzamos a Dockerfile a incluir freedreno_icd.json en la raíz usando zip -j (junk paths)
        sed -i 's/zip -r ..\/panvk-mali-bifrost-driver.zip .\/libGL.so.1 .\/libglapi.so.0 .\/libvulkan_freedreno.so .\/meta.json/zip -j ..\/panvk-mali-bifrost-driver.zip .\/libGL.so.1 .\/libglapi.so.0 .\/libvulkan_freedreno.so .\/meta.json .\/freedreno_icd.json/g' Dockerfile.build || true

        echo "=== VERIFICACIÓN DE MANIFIESTO NATIVO ==="
        cat freedreno_icd.json || true

    - name: 🐳 3. Configurar Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🚀 4. Procesar y Generar Empaquetado de Driver via Docker
      run: |
        docker build --no-cache -f Dockerfile.build --target final -t bannerlator-bifrost-11 .

    - name: 📦 5. Extraer Paquete Zip Final de Android 11
      run: |
        docker create --name container-extract bannerlator-bifrost-11
        docker cp container-extract:/dist/panvk-mali-bifrost-driver.zip ./panvk-mali-bifrost-driver.zip
        docker rm container-extract

    - name: 📤 6. Subir Driver a los Artefactos de GitHub
      uses: actions/upload-artifact@v4
      with:
        name: panvk-mali-bifrost-driver-zip
        path: panvk-mali-bifrost-driver.zip
