          # Se inyectan parches de extensiones, se aplica cross-file para Android26-clang
          # y se compila Mesa con soporte Panfrost unificado.
          # (Detalles completos en la fuente)
      - name: Extract and Pack
        run: |
          # [Sección resumida: Extracción del .so y creación del ZIP final]
          # Se extrae libvulkan_freedreno.so y se crea un ZIP plano (zip -j).
          # (Detalles completos en la fuente)
      - uses: actions/upload-artifact@v4
        with:
          name: panvk-mali-bifrost-driver-zip
          path: panvk-mali-bifrost-driver.zip
