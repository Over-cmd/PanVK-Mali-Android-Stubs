name: Build PanVK Bifrost Vulkan 1.1 for Android 11

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  repackage-vulkan-driver:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 1. Clonar tu propio repositorio (Fork)
      uses: actions/checkout@v4

    - name: 🔧 2. Inyectar Binario de Vídeo Real de 18 MB (Bypass de Bloqueo HTML)
      run: |
        echo "-> Creando espacio de trabajo aislado en el servidor..."
        mkdir -p driver_workspace
        cd driver_workspace

        echo "-> Forzando descarga directa del binario de Nihui compilado (18.25 MB)..."
        # Usamos el token interno nativo de GitHub para forzar la descarga del binario puro saltándonos el bloqueo HTTP 302
        curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -L -f -o ./libvulkan_freedreno.so https://github.com || \
        curl -L -f -o ./libvulkan_freedreno.so https://githubusercontent.com

        echo "-> Escribiendo meta.json original estricto con el enlace de freedreno..."
        # Mantenemos de forma estricta el nombre libvulkan_freedreno.so en todas las llaves de metadatos
        cat << 'EOF' > meta.json
        {
          "schemaVersion": 1,
          "type": "vulkan",
          "driver": "panvk",
          "name": "Mesa PanVK Driver for Mali",
          "description": "Custom PanVK Vulkan driver for MediaTek/Unisoc",
          "author": "Mesa Community",
          "packageVersion": "26.2",
          "vendor": "Mesa",
          "driverVersion": "1",
          "libraryName": "libvulkan_freedreno.so"
        }
        EOF

        echo "-> Asegurando permisos nativos de lectura y ejecución (CHMOD 755)..."
        chmod 755 ./libvulkan_freedreno.so ./meta.json

        echo "=== VERIFICACIÓN CIENTÍFICA: PESO REAL DEL DRIVER ==="
        ls -lh ./
        echo "======================================================"

        echo "-> Generando el archivo ZIP plano con el binario real..."
        # La bandera -j junta los 2 archivos exactos sueltos en la raíz sin carpetas intermedias
        rm -f ../panvk-mali-bifrost-driver.zip
        zip -j ../panvk-mali-bifrost-driver.zip ./libvulkan_freedreno.so ./meta.json
        cd ..

    - name: 📦 3. Verificar Integridad del ZIP Resultante
      run: |
        echo "=== VERIFICACIÓN DEL TAMAÑO TOTAL DEL ZIP ==="
        ls -lh panvk-mali-bifrost-driver.zip
        echo "============================================="

    - name: 📤 4. Subir Driver a los Artefactos de GitHub
      uses: actions/upload-artifact@v4
      with:
        name: panvk-mali-bifrost-driver-zip
        path: panvk-mali-bifrost-driver.zip
