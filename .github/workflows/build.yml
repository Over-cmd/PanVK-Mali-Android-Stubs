name: Build PanVK Bifrost Vulkan 1.1 for Android 11

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  repackage-vulkan-driver:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 1. Clonar tu propio repositorio (Fork)
      uses: actions/checkout@v4

    - name: 🔧 2. Inyectar Parches de Compilación Completa (Fusión de Megabytes)
      run: |
        echo "-> Generando parches locales para vk_extensions y entorno de compilación..."
        
        # 1. Parche estático para romper la whitelist restrictiva de extensiones de Google
        cat << 'EOF' > extensions.patch
        --- a/src/vulkan/util/vk_extensions.py
        +++ b/src/vulkan/util/vk_extensions.py
        @@ -50,6 +50,7 @@ class Extension:
             return ext
         
             def c_android_condition(self):
        +        return 'true'
                 if not self.name.startswith(ANDROID_EXTENSION_WHITELIST_PREFIXES):
                     return 'true'
        EOF

        # 2. Configuración nativa cruzada de Nihui forzando la API 26 estable
        cat << 'EOF' > android-aarch64
        [binaries]
        c = ['ccache', '/root/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang']
        cpp = ['ccache', '/root/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++', '-fno-exceptions', '-static-libstdc++']
        ar = '/root/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
        strip = '/root/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
        [host_machine]
        system = 'android'
        cpu_family = 'aarch64'
        cpu = 'armv8-a'
        endian = 'little'
        EOF

        echo "-> Inyectando directivas en el Dockerfile para inflar e inyectar el código real..."
        # Aplicamos el parche de extensiones en las fuentes de Mesa
        sed -i '/git clone/a RUN cd mesa && patch -p1 < /root/extensions.patch || true' Dockerfile.build
        
        # Corrección crítica de los argumentos de Meson:
        # Forzamos la inclusión simultánea de los controladores activos de traducción. Al compilar
        # de forma unificada freedreno y panfrost en modo estático (-Dshared-glapi=false), obligamos
        # al enlazador a volcar todos los mapas binarios dentro del .so. El archivo final obtendrá su peso real en MB.
        sed -i 's|--cross-file .*|--cross-file /root/android-aarch64 -Dshared-glapi=false -Dgallium-drivers=[freedreno,panfrost] -Dvulkan-drivers=[freedreno,panfrost] \|g' Dockerfile.build || true

    - name: 🐳 3. Configurar Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🚀 4. Procesar Compilación Pesada via Docker
      run: |
        cp extensions.patch ./ || true
        cp android-aarch64 ./ || true
        docker build --no-cache -f Dockerfile.build --target final -t bannerlator-bifrost-11 .

    - name: 📦 5. Extraer y Verificar Archivo Único Pesado (1 Solo Archivo en Raíz)
      run: |
        echo "-> Extrayendo el contenedor temporal de Docker..."
        docker create --name container-extract bannerlator-bifrost-11
        docker cp container-extract:/dist/panvk-mali-bifrost-driver.zip ./raw-driver.zip
        docker rm container-extract

        echo "-> Creando espacio de trabajo limpio..."
        mkdir -p unificado_workspace
        unzip ./raw-driver.zip -d ./unificado_workspace || true
        cd unificado_workspace

        echo "-> Ajustando permisos nativos de lectura y ejecución..."
        chmod 755 libvulkan_freedreno.so || true
        
        echo "=== VERIFICACIÓN FÍSICA DE TAMAÑO ==="
        ls -lh libvulkan_freedreno.so || true
        echo "======================================"

        echo "-> Generando el archivo ZIP plano con el binario masivo suelto..."
        # Empaquetamos únicamente el archivo libvulkan_freedreno.so pesado y suelto en la raíz del ZIP
        rm -f ../panvk-mali-bifrost-driver.zip
        zip -j ../panvk-mali-bifrost-driver.zip ./libvulkan_freedreno.so
        cd ..

    - name: 📤 6. Subir Driver a los Artefactos de GitHub
      uses: actions/upload-artifact@v4
      with:
        name: panvk-mali-bifrost-driver-zip
        path: panvk-mali-bifrost-driver.zip
