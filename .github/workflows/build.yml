name: Build PanVK Bifrost Vulkan 1.1 for Android 11

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  repackage-vulkan-driver:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 1. Clonar tu propio repositorio (Fork)
      uses: actions/checkout@v4

    - name: 🐳 2. Configurar Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🚀 3. Procesar y Generar Empaquetado de Driver via Docker
      run: |
        docker build --no-cache -f Dockerfile.build --target final -t bannerlator-bifrost-11 .

    - name: 📦 4. Extraer Paquete y Forzar Estructura de 4 Archivos Planos
      run: |
        echo "-> Extrayendo el contenedor de Docker..."
        docker create --name container-extract bannerlator-bifrost-11
        docker cp container-extract:/dist/panvk-mali-bifrost-driver.zip ./raw-driver.zip
        docker rm container-extract

        echo "-> Creando espacio de trabajo limpio..."
        mkdir -p driver_workspace
        unzip ./raw-driver.zip -d ./driver_workspace || true
        cd driver_workspace

        echo "-> Escribiendo meta.json con precarga obligatoria..."
        # Mantenemos intacto tu meta.json original, incluyendo el nombre de tu archivo
        # libvulkan_freedreno.so, pero forzando LD_PRELOAD para enlazar libglapi.so.0
        cat << 'EOF' > meta.json
        {
          "schemaVersion": 1,
          "type": "vulkan",
          "driver": "panvk",
          "env": {
            "LD_PRELOAD": "libglapi.so.0"
          },
          "name": "Mesa PanVK Driver for Mali",
          "description": "Custom PanVK Vulkan driver for MediaTek/Unisoc",
          "author": "Mesa Community",
          "packageVersion": "26.2",
          "vendor": "Mesa",
          "driverVersion": "1",
          "libraryName": "libvulkan_freedreno.so"
        }
        EOF

        echo "-> Aplicando permisos de ejecución (CHMOD 755) a la suite nativa..."
        chmod 755 libGL.so.1 libglapi.so.0 libvulkan_freedreno.so meta.json || true

        echo "-> Generando el archivo ZIP con estrictamente los 4 elementos sueltos..."
        # El comando zip -j asegura que no existan carpetas intermedias ni archivos JSON extra.
        zip -j ../panvk-mali-bifrost-driver.zip ./libGL.so.1 ./libglapi.so.0 ./libvulkan_freedreno.so ./meta.json
        cd ..

    - name: 📤 5. Subir Driver a los Artefactos de GitHub
      uses: actions/upload-artifact@v4
      with:
        name: panvk-mali-bifrost-driver-zip
        path: panvk-mali-bifrost-driver.zip
