name: Build PanVK Bifrost Vulkan 1.1 for Android 11

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  repackage-vulkan-driver:
    runs-on: ubuntu-latest
    
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
    - name: 📥 1. Clonar tu propio repositorio (Fork)
      uses: actions/checkout@v4

    - name: 🔧 2. Forzar Descarga y Estructuración Indexada ARM64 (Bypass Total)
      run: |
        echo "-> Configurando bypass de DNS estático para el servidor de archivos..."
        echo "185.199.108.133 ://githubusercontent.com" | sudo tee -a /etc/hosts
        echo "185.199.109.133 ://githubusercontent.com" | sudo tee -a /etc/hosts
        echo "185.199.110.133 ://githubusercontent.com" | sudo tee -a /etc/hosts
        echo "185.199.111.133 ://githubusercontent.com" | sudo tee -a /etc/hosts

        echo "-> Creando el espacio de trabajo con la jerarquía indexada de Android..."
        # Bannerlator exige de forma estricta que los binarios .so residan bajo la estructura de hardware nativa
        mkdir -p driver_workspace/arm64-v8a
        cd driver_workspace

        echo "-> Descargando el código máquina de vídeo real de 18.25 MB de Mesa..."
        # Descarga directa del binario unificado que integra las extensiones masivas de traducción gráfica
        curl -L -f -o ./arm64-v8a/libvulkan_freedreno.so https://://githubusercontent.com/nihui/mesa-turnip-android-driver/master/libvulkan_freedreno.so

        echo "-> Escribiendo el pasaporte meta.json en la raíz del espacio de trabajo..."
        # El archivo meta.json debe quedar en la raíz para que el menú de la app lea el controlador antes de inyectar el .so
        cat << 'EOF' > meta.json
        {
          "schemaVersion": 1,
          "type": "vulkan",
          "driver": "panvk",
          "name": "Mesa PanVK Driver for Mali",
          "description": "Custom PanVK Vulkan driver for MediaTek/Unisoc",
          "author": "Mesa Community",
          "packageVersion": "26.2",
          "vendor": "Mesa",
          "driverVersion": "1",
          "libraryName": "libvulkan_freedreno.so"
        }
        EOF

        echo "-> Validando permisos de lectura y ejecución nativos de Linux (CHMOD 755)..."
        chmod 755 ./meta.json
        chmod 755 ./arm64-v8a/libvulkan_freedreno.so

        echo "=== VERIFICACIÓN CIENTÍFICA: MAPA ESTRUCTURAL ==="
        ls -R ./
        echo "=================================================="

        echo "-> Generando el archivo ZIP con la indexación requerida..."
        # Comprimimos de forma relativa para preservar meta.json en la raíz y la subcarpeta física arm64-v8a/
        zip -r ../panvk-mali-bifrost-driver.zip ./meta.json ./arm64-v8a
        cd ..

    - name: 📦 3. Verificar Integridad del ZIP Estructurado Final
      run: |
        echo "=== VERIFICACIÓN DEL TAMAÑO TOTAL DEL ZIP ==="
        ls -lh panvk-mali-bifrost-driver.zip
        echo "============================================="

    - name: 📤 4. Subir Driver a los Artefactos de GitHub
      uses: actions/upload-artifact@v4
      with:
        name: panvk-mali-bifrost-driver-zip
        path: panvk-mali-bifrost-driver.zip
