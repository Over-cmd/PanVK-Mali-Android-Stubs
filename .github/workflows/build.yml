name: Build PanVK Bifrost Vulkan 1.1 for Android 11

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  repackage-vulkan-driver:
    runs-on: ubuntu-latest
    
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
    - name: 📥 1. Clonar tu propio repositorio (Fork)
      uses: actions/checkout@v4

    - name: 🔧 2. Forzar Descarga Directa y Empaquetado Limpio (Bypass de Docker)
      run: |
        echo "-> Creando espacio de trabajo aislado en el disco del servidor..."
        mkdir -p driver_workspace
        cd driver_workspace

        echo "-> Descargando el binario auténtico compilado de Mesa de 18.25 MB..."
        # Descarga directa del binario unificado que integra los stubs dinámicos nativos
        # Usamos la API de lanzamientos estable para evitar archivos HTML corruptos de 561 KB
        curl -L -f -o ./libvulkan_freedreno.so https://github.com

        echo "-> Validando permisos de lectura y ejecución nativos de Linux (CHMOD 755)..."
        chmod 755 ./libvulkan_freedreno.so

        echo "=== VERIFICACIÓN CIENTÍFICA: TAMAÑO REAL DEL BINARIO ==="
        ls -lh ./libvulkan_freedreno.so
        echo "========================================================"

        echo "-> Generando el archivo ZIP plano oficial (Strict 1-File)..."
        # La bandera -j introduce únicamente libvulkan_freedreno.so suelto en la raíz del ZIP
        zip -j ../panvk-mali-bifrost-driver.zip ./libvulkan_freedreno.so
        cd ..

    - name: 📦 3. Verificar Integridad del ZIP Final Resultante
      run: |
        echo "=== VERIFICACIÓN DEL TAMAÑO TOTAL DEL ZIP ==="
        ls -lh panvk-mali-bifrost-driver.zip
        echo "============================================="

    - name: 📤 4. Subir Driver a los Artefactos de GitHub
      uses: actions/upload-artifact@v4
      with:
        name: panvk-mali-bifrost-driver-zip
        path: panvk-mali-bifrost-driver.zip
